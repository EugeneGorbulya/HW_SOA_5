# Вся система: docker compose up --build
#
#   Movie Service (producer) → Kafka (3 брокера, topic movie-events) → ClickHouse (Kafka Engine → MergeTree)
#            ↓ схема                                                        ↓ SELECT            ↓
#     Schema Registry                                             Aggregation Service        Grafana
#                                                                  ↓ UPSERT       ↓ CSV
#                                                              PostgreSQL        MinIO (S3)

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 10s
  retries: 30

# Узел Kafka в режиме KRaft: и брокер, и контроллер. Узлов три — кворуму контроллеров нужно большинство
x-kafka: &kafka
  image: apache/kafka:4.1.1
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
    <<: *healthcheck

x-kafka-env: &kafka-env
  CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
  KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  # Топики создаёт только kafka-init — опечатка в имени не заведёт новый топик молча
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  KAFKA_HEAP_OPTS: -Xms256m -Xmx512m

x-kafka-brokers: &kafka-brokers kafka-1:9092,kafka-2:9092,kafka-3:9092

x-kafka-healthy: &kafka-healthy
  kafka-1:
    condition: service_healthy
  kafka-2:
    condition: service_healthy
  kafka-3:
    condition: service_healthy

services:
  # ---------- Kafka: 3 брокера + Schema Registry (п.1, п.8) ----------
  kafka-1:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092

  kafka-2:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092

  kafka-3:
    <<: *kafka
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092

  # Создаёт topic movie-events: 3 партиции, replication.factor=3, min.insync.replicas=2
  kafka-init:
    image: apache/kafka:4.1.1
    depends_on: *kafka-healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --create --if-not-exists \
          --topic movie-events --partitions 3 --replication-factor 3 --config min.insync.replicas=2 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-1:9092 --describe --topic movie-events

  schema-registry:
    image: confluentinc/cp-schema-registry:8.1.0
    depends_on: *kafka-healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: *kafka-brokers
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
      SCHEMA_REGISTRY_HEAP_OPTS: -Xms128m -Xmx256m
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/subjects"]
      <<: *healthcheck

  # ---------- Movie Service: HTTP API + генератор событий (п.2) ----------
  producer:
    build:
      context: ./producer
      additional_contexts:
        schemas: ./schemas
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: *kafka-brokers
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      KAFKA_TOPIC: movie-events
      PUBLISH_MAX_ATTEMPTS: ${PUBLISH_MAX_ATTEMPTS:-3}
      PUBLISH_RETRY_BASE_DELAY_MS: ${PUBLISH_RETRY_BASE_DELAY_MS:-200}
      GENERATOR_ENABLED: ${GENERATOR_ENABLED:-true}
      GENERATOR_BACKFILL_DAYS: ${GENERATOR_BACKFILL_DAYS:-8}
      GENERATOR_SESSIONS_PER_MINUTE: ${GENERATOR_SESSIONS_PER_MINUTE:-20}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      <<: *healthcheck

  # ---------- ClickHouse: raw-события и агрегаты (п.3, п.5) ----------
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    ports:
      - "8123:8123"
    environment:
      CLICKHOUSE_DB: cinema
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      <<: *healthcheck

  # Миграции ClickHouse: применяет clickhouse/migrations/*.sql по порядку и завершается
  clickhouse-migrations:
    build: ./clickhouse
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy

  # ---------- PostgreSQL: готовые метрики (п.5) ----------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "15440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      <<: *healthcheck

  postgres-migrations:
    build: ./aggregation-service/db
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/analytics
      FLYWAY_USER: analytics
      FLYWAY_PASSWORD: analytics
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- MinIO: S3 для экспорта (п.7) ----------
  minio:
    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z
    # образ работает от пользователя minio — данные кладём в его домашний каталог
    command: ["server", "/home/minio/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/live"]
      <<: *healthcheck

  # ---------- Aggregation Service: метрики → PostgreSQL → S3 (п.5, п.7) ----------
  aggregation-service:
    build: ./aggregation-service
    ports:
      - "8001:8001"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema
      CLICKHOUSE_DATABASE: cinema
      POSTGRES_DSN: postgresql://analytics:analytics@postgres:5432/analytics
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: movie-analytics
      # как часто пересчитывать агрегаты и за сколько прошлых дней (поздние события, D7)
      AGGREGATION_INTERVAL_SECONDS: ${AGGREGATION_INTERVAL_SECONDS:-30}
      AGGREGATION_LOOKBACK_DAYS: ${AGGREGATION_LOOKBACK_DAYS:-8}
      # ежедневный экспорт за вчера, cron в UTC
      EXPORT_CRON: ${EXPORT_CRON:-5 0 * * *}
    depends_on:
      clickhouse-migrations:
        condition: service_completed_successfully
      postgres-migrations:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      <<: *healthcheck

  # ---------- Grafana: дашборд по агрегатам ClickHouse (п.6) ----------
  grafana:
    build: ./grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/movie-analytics.json
    depends_on:
      clickhouse-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      <<: *healthcheck

  # ---------- Интеграционные тесты (п.4): docker compose run --rm tests ----------
  tests:
    profiles: ["test"]
    build: ./tests
    environment:
      PRODUCER_URL: http://producer:8000
      AGGREGATION_URL: http://aggregation-service:8001
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: cinema
      CLICKHOUSE_PASSWORD: cinema
      CLICKHOUSE_DATABASE: cinema
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: movie-analytics
    depends_on:
      producer:
        condition: service_healthy
      aggregation-service:
        condition: service_healthy
